apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "compliance-agent.fullname" . }}
  labels:
    {{- include "compliance-agent.labels" . | nindent 4 }}
data:
  AWS_REGION: {{ .Values.aws.region | quote }}
  AWS_DEFAULT_REGION: {{ .Values.aws.region | quote }}
  {{- if .Values.github.enabled }}
  GITHUB_REPO: {{ .Values.github.repo | quote }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
  PUSHGATEWAY_URL: {{ .Values.metrics.pushgatewayUrl | quote }}
  {{- end }}
  # botocore needs a writable cache dir; readOnlyRootFilesystem forces it to /tmp.
  TMPDIR: "/tmp"
