{{- if .Values.secret.create -}}
# WARNING: opt-in, for LOCAL demos only. Provide values via --set at install
# time; never commit real credentials into a values file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "compliance-agent.fullname" . }}
  labels:
    {{- include "compliance-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.secret.awsAccessKeyId | quote }}
  {{- end }}
  {{- if .Values.secret.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secret.awsSecretAccessKey | quote }}
  {{- end }}
  {{- if .Values.secret.githubToken }}
  GITHUB_TOKEN: {{ .Values.secret.githubToken | quote }}
  {{- end }}
  {{- if .Values.secret.maskSalt }}
  MASK_SALT: {{ .Values.secret.maskSalt | quote }}
  {{- end }}
{{- end }}
